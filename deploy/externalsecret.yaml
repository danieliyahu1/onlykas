apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaskama-secrets
  namespace: kaskama
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaskama-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: kaskama_database_url
    - secretKey: DATABASE_AUTH_TOKEN
      remoteRef:
        key: kaskama_database_auth_token
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: kaskama_r2_endpoint
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: kaskama_r2_access_key_id
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: kaskama_r2_secret_access_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaskama-telegram
  namespace: kaskama
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaskama-telegram
    creationPolicy: Owner
  data:
    - secretKey: botToken
      remoteRef:
        key: kaskama_telegram_feedback_bot_token
    - secretKey: chatId
      remoteRef:
        key: kaskama_telegram_feedback_chat_id
---
# Maps the production platform fee wallet from OCI Vault into the
# `kaskama-platform-fee-address` Secret the Deployment reads. Production runs on
# mainnet only, so only the mainnet wallet is mapped. Only the Vault entry NAME
# lives in Git; the address is fetched at runtime and never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaskama-platform-fee-address
  namespace: kaskama
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaskama-platform-fee-address
    creationPolicy: Owner
  data:
    - secretKey: mainnet
      remoteRef:
        key: kaskama_platform_fee_address_mainnet
