apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onlykas-secrets
  namespace: onlykas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: onlykas-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: onlykas-DATABASE_URL
    - secretKey: DATABASE_AUTH_TOKEN
      remoteRef:
        key: onlykas-DATABASE_AUTH_TOKEN
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: onlykas-R2_ENDPOINT
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: onlykas-R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: onlykas-R2_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onlykas-telegram
  namespace: onlykas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: onlykas-telegram
    creationPolicy: Owner
  data:
    - secretKey: botToken
      remoteRef:
        key: onlykas-TELEGRAM_FEEDBACK_BOT_TOKEN
    - secretKey: chatId
      remoteRef:
        key: onlykas-TELEGRAM_FEEDBACK_CHAT_ID
---
# Maps the per-network platform fee wallets from OCI Vault into the
# `onlykas-platform-fee-address` Secret the Deployment reads. Both networks are
# always mapped, so switching KASPA_NETWORK needs no secret change — the process
# picks the entry that matches the selected network. Only the Vault entry NAMEs
# live in Git; the addresses are fetched at runtime and never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onlykas-platform-fee-address
  namespace: onlykas
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: onlykas-platform-fee-address
    creationPolicy: Owner
  data:
    - secretKey: mainnet
      remoteRef:
        key: onlykas-platform-fee-address-mainnet
    - secretKey: testnet-10
      remoteRef:
        key: onlykas-platform-fee-address-testnet-10
