apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaskama-secrets
  namespace: kaskama
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaskama-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: onlykas-DATABASE_URL
    - secretKey: DATABASE_AUTH_TOKEN
      remoteRef:
        key: onlykas-DATABASE_AUTH_TOKEN
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: onlykas-R2_ENDPOINT
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: onlykas-R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: onlykas-R2_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaskama-telegram
  namespace: kaskama
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaskama-telegram
    creationPolicy: Owner
  data:
    - secretKey: botToken
      remoteRef:
        key: onlykas-TELEGRAM_FEEDBACK_BOT_TOKEN
    - secretKey: chatId
      remoteRef:
        key: onlykas-TELEGRAM_FEEDBACK_CHAT_ID
---
# Maps the production platform fee wallet from OCI Vault into the
# `kaskama-platform-fee-address` Secret the Deployment reads. Production runs on
# mainnet only, so only the mainnet wallet is mapped. Only the Vault entry NAME
# lives in Git; the address is fetched at runtime and never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaskama-platform-fee-address
  namespace: kaskama
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaskama-platform-fee-address
    creationPolicy: Owner
  data:
    - secretKey: mainnet
      remoteRef:
        key: onlykas-platform-fee-address-mainnet
