apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaskama
  namespace: kaskama
  labels:
    app.kubernetes.io/name: kaskama
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kaskama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaskama
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kaskama
          image: ghcr.io/danieliyahu1/kaskama:3f435a62b3745169b599ddc41534abf2e563ffac
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: kaskama-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kaskama-secrets
                  key: DATABASE_URL
            - name: DATABASE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kaskama-secrets
                  key: DATABASE_AUTH_TOKEN
                  optional: true
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: kaskama-secrets
                  key: R2_ENDPOINT
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kaskama-secrets
                  key: R2_ACCESS_KEY_ID
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kaskama-secrets
                  key: R2_SECRET_ACCESS_KEY
            # Production runs on mainnet, so only the mainnet platform fee
            # wallet is configured; it must match KASPA_NETWORK.
            - name: PLATFORM_FEE_ADDRESS_MAINNET
              valueFrom:
                secretKeyRef:
                  name: kaskama-platform-fee-address
                  key: mainnet
            - name: TELEGRAM_FEEDBACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kaskama-telegram
                  key: botToken
                  optional: true
            - name: TELEGRAM_FEEDBACK_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: kaskama-telegram
                  key: chatId
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
