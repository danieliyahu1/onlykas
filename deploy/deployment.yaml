apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlykas
  namespace: onlykas
  labels:
    app.kubernetes.io/name: onlykas
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: onlykas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onlykas
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: onlykas
          image: ghcr.io/danieliyahu1/onlykas:c8d1f271fdaa56c800997a6d38015723d0d59fb7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: onlykas-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onlykas-secrets
                  key: DATABASE_URL
            - name: DATABASE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: onlykas-secrets
                  key: DATABASE_AUTH_TOKEN
                  optional: true
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: onlykas-secrets
                  key: R2_ENDPOINT
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: onlykas-secrets
                  key: R2_ACCESS_KEY_ID
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: onlykas-secrets
                  key: R2_SECRET_ACCESS_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
