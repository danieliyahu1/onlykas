apiVersion: v1
kind: Service
metadata:
  name: kaskama-metrics
  namespace: kaskama
  labels:
    app.kubernetes.io/name: kaskama
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kaskama
    app.kubernetes.io/component: web
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
