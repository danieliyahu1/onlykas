apiVersion: v1
kind: ConfigMap
metadata:
  name: kaskama-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  kaskama-overview.json: |
    {
      "uid": "kaskama-overview",
      "title": "Kaskama / Overview",
      "tags": ["kaskama"],
      "timezone": "UTC",
      "editable": false,
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "id": 18,
          "type": "stat",
          "title": "Homepage opens",
          "description": "Full document loads of the homepage. Counts visits, not unique people.",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_page_visits_total{job=\"kaskama\"}[$__range])) or vector(0)",
              "legendFormat": "homepage opens"
            }
          ]
        },
        {
          "id": 19,
          "type": "stat",
          "title": "Sign-ins",
          "description": "Successful wallet sign-ins. Counts sessions created, not unique people.",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_auth_session_total{job=\"kaskama\",outcome=\"created\"}[$__range])) or vector(0)",
              "legendFormat": "sign-ins"
            }
          ]
        },
        {
          "id": 20,
          "type": "stat",
          "title": "Reached the creators page",
          "description": "Times the public creators page was opened. Counts visits, not unique people.",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_http_requests_total{job=\"kaskama\",route=\"/api/creators/public\"}[$__range])) or vector(0)",
              "legendFormat": "creators page opens"
            }
          ]
        },
        {
          "id": 21,
          "type": "stat",
          "title": "Reached a creator page",
          "description": "Times any creator profile page was opened. Counts visits, not unique people.",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_http_requests_total{job=\"kaskama\",route=\"/api/creators/:address\"}[$__range])) or vector(0)",
              "legendFormat": "creator page opens"
            }
          ]
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Audience over time",
          "description": "Open/sign-in count per time interval. The y-axis is visits, not a per-second rate.",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "custom": {
                "axisLabel": "visits",
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 2,
                "stacking": { "mode": "none" },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_page_visits_total{job=\"kaskama\"}[$__interval])) or vector(0)",
              "legendFormat": "GET /"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_auth_session_total{job=\"kaskama\",outcome=\"created\"}[$__interval])) or vector(0)",
              "legendFormat": "POST /api/auth/session"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_http_requests_total{job=\"kaskama\",route=\"/api/creators/public\"}[$__interval])) or vector(0)",
              "legendFormat": "GET /api/creators/public"
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(increase(kaskama_http_requests_total{job=\"kaskama\",route=\"/api/creators/:address\"}[$__interval])) or vector(0)",
              "legendFormat": "GET /api/creators/:address"
            }
          ]
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape targets up",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(up{job=\"kaskama\"})",
              "legendFormat": "up"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(rate(kaskama_http_requests_total{job=\"kaskama\"}[$__rate_interval]))",
              "legendFormat": "requests"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(rate(kaskama_http_requests_total{job=\"kaskama\",status=~\"5..\"}[$__rate_interval]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Requests in flight",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 14 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(kaskama_http_requests_in_flight{job=\"kaskama\"})",
              "legendFormat": "in flight"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request rate by route",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (route) (rate(kaskama_http_requests_total{job=\"kaskama\"}[$__rate_interval]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Request duration p95",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(kaskama_http_request_duration_seconds_bucket{job=\"kaskama\"}[$__rate_interval])))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Media publish by outcome",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 26 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (outcome) (rate(kaskama_media_publish_total{job=\"kaskama\"}[$__rate_interval]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Media delivery bytes / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (media_type) (rate(kaskama_media_delivery_bytes_total{job=\"kaskama\"}[$__rate_interval]))",
              "legendFormat": "{{media_type}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Payment finalization by state",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 34 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (state) (rate(kaskama_payment_finalize_total{job=\"kaskama\"}[$__rate_interval]))",
              "legendFormat": "{{state}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Membership finalization by state",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (kind, state) (rate(kaskama_membership_finalize_total{job=\"kaskama\"}[$__rate_interval]))",
              "legendFormat": "{{kind}} {{state}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Dependency errors / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (dependency, operation) (rate(kaskama_dependency_requests_total{job=\"kaskama\",outcome=\"error\"}[$__rate_interval]))",
              "legendFormat": "{{dependency}} {{operation}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Dependency duration p95",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 50 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "histogram_quantile(0.95, sum by (le, dependency) (rate(kaskama_dependency_request_duration_seconds_bucket{job=\"kaskama\"}[$__rate_interval])))",
              "legendFormat": "{{dependency}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "CPU cores",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 50 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (pod) (rate(process_cpu_seconds_total{job=\"kaskama\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Resident memory",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 50 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "process_resident_memory_bytes{job=\"kaskama\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Event loop lag",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 58 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "nodejs_eventloop_lag_seconds{job=\"kaskama\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }