apiVersion: v1
kind: ConfigMap
metadata:
  name: onlykas-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  onlykas-overview.json: |
    {
      "uid": "onlykas-overview",
      "title": "OnlyKas / Overview",
      "tags": ["onlykas"],
      "timezone": "UTC",
      "editable": false,
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Scrape targets up",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(up{job=\"onlykas\"})",
              "legendFormat": "up"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(rate(onlykas_http_requests_total{job=\"onlykas\"}[$__rate_interval]))",
              "legendFormat": "requests"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(rate(onlykas_http_requests_total{job=\"onlykas\",status=~\"5..\"}[$__rate_interval]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Requests in flight",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum(onlykas_http_requests_in_flight{job=\"onlykas\"})",
              "legendFormat": "in flight"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request rate by route",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (route) (rate(onlykas_http_requests_total{job=\"onlykas\"}[$__rate_interval]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Request duration p95",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(onlykas_http_request_duration_seconds_bucket{job=\"onlykas\"}[$__rate_interval])))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Media publish by outcome",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (outcome) (rate(onlykas_media_publish_total{job=\"onlykas\"}[$__rate_interval]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Media delivery bytes / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (media_type) (rate(onlykas_media_delivery_bytes_total{job=\"onlykas\"}[$__rate_interval]))",
              "legendFormat": "{{media_type}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Payment finalization by state",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (state) (rate(onlykas_payment_finalize_total{job=\"onlykas\"}[$__rate_interval]))",
              "legendFormat": "{{state}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Membership finalization by state",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (kind, state) (rate(onlykas_membership_finalize_total{job=\"onlykas\"}[$__rate_interval]))",
              "legendFormat": "{{kind}} {{state}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Dependency errors / sec",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (dependency, operation) (rate(onlykas_dependency_requests_total{job=\"onlykas\",outcome=\"error\"}[$__rate_interval]))",
              "legendFormat": "{{dependency}} {{operation}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Dependency duration p95",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "histogram_quantile(0.95, sum by (le, dependency) (rate(onlykas_dependency_request_duration_seconds_bucket{job=\"onlykas\"}[$__rate_interval])))",
              "legendFormat": "{{dependency}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "CPU cores",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 36 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "sum by (pod) (rate(process_cpu_seconds_total{job=\"onlykas\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Resident memory",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 36 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "process_resident_memory_bytes{job=\"onlykas\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Event loop lag",
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 36 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
              "expr": "nodejs_eventloop_lag_seconds{job=\"onlykas\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
