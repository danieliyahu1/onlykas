apiVersion: v1
kind: ConfigMap
metadata:
  name: onlykas-config
  namespace: onlykas
data:
  NODE_ENV: production
  PORT: "3000"
  METRICS_PORT: "9090"
  PUBLIC_ORIGIN: https://onlykas.danieliyahu.com
  R2_REGION: auto
  R2_BUCKET: onlykas-production
  KASPA_NODE_URL: https://api-tn10.kaspa.org
  MEDIA_JOB_INTERVAL_MS: "5000"
  PAYMENT_RECONCILIATION_INTERVAL_MS: "3000"
  MEDIA_JOB_STALE_MS: "300000"
  FEEDBACK_SPILL_PATH: /tmp/feedback-spill.json
