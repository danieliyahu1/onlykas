apiVersion: v1
kind: ConfigMap
metadata:
  name: onlykas-config
  namespace: onlykas
data:
  NODE_ENV: production
  PORT: "3000"
  METRICS_PORT: "9090"
  PUBLIC_ORIGIN: https://onlykas.app
  R2_REGION: auto
  R2_BUCKET: onlykas-production
  # Production runs on mainnet. KASPA_NETWORK selects the address prefix, the
  # wallet network, and the default node URL; the matching platform fee wallet
  # is injected from the onlykas-platform-fee-address Secret.
  KASPA_NETWORK: mainnet
  FEEDBACK_SPILL_PATH: /tmp/feedback-spill.json
