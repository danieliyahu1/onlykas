apiVersion: v1
kind: ConfigMap
metadata:
  name: kaskama-config
  namespace: kaskama
data:
  NODE_ENV: production
  PORT: "3000"
  METRICS_PORT: "9090"
  PUBLIC_ORIGIN: https://kaskama.com
  R2_REGION: auto
  R2_BUCKET: kaskama-production
  # Production runs on mainnet. KASPA_NETWORK selects the address prefix, the
  # wallet network, and the default node URL; the matching platform fee wallet
  # is injected from the kaskama-platform-fee-address Secret.
  KASPA_NETWORK: mainnet
  FEEDBACK_SPILL_PATH: /tmp/feedback-spill.json
